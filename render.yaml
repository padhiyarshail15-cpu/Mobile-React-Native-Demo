# Render Blueprint for the ClimateLens API (apps/api).
# Create it once: Render Dashboard > New > Blueprint > pick this repo and branch.
# Steps and troubleshooting: apps/api/README.md ("Deploying to Render").
services:
  - type: web
    runtime: node
    name: climatelens-api
    # Render has no Mumbai region; Singapore is the closest to the Supabase database.
    # The region cannot be changed after the service is created.
    region: singapore
    plan: free
    # The branch is not set here: Render uses the branch the Blueprint is created from.
    # Installs only the API's dependencies (not React Native's), then compiles to apps/api/dist.
    buildCommand: corepack enable && yarn workspaces focus api && yarn workspace api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    # Only redeploy when something the API depends on changes (paths are relative to the repo root).
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - yarn.lock
        - .yarnrc.yml
        - .nvmrc
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT
        value: '10000'
      - key: LOG_LEVEL
        value: info
      # The Supabase session-pooler URL. Render asks for it when the Blueprint is created.
      # Never put the real value in this file.
      - key: DATABASE_URL
        sync: false
